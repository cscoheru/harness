# fish-harness v1.0 deploy (T-DO-4 + T-QA-1)
#
# Goal: when a `v*` tag is pushed (or workflow_dispatch for dry-run),
# build the runtime image, push it to GHCR, and run the in-container
# mutation_suite smoke gate (T-QA-1 ships; deploy smoke now matches
# GA plan §2 T-DO-4 spec, not the 5-spike interim).
#
# T-QA-1 dependency (RESOLVED): `harness.testing.mutation_suite` now
# exists; deploy smoke calls `python -m harness.testing.mutation_suite`
# (17/17 reverse-DROP causal-chain mutations). See DISPATCH-T-QA-1 §A
# for behavior contract.
#
# P0 fix (per REVIEW-T-DO-3): the previous design had `smoke` as a
# SEPARATE job whose runner did NOT have the image (build only did
# `load: true` into the build runner's local daemon). Moved the smoke
# step INTO the build job — same runner, same daemon, same image.
#
# P1 fix (2026-09-01): the `push` job runs on a SEPARATE runner and needs its
# own `actions/checkout@v4` — the build job's checkout doesn't propagate, so
# `context: .` in `Push tag + latest` was resolving to an empty cwd and buildx
# errored with `open Dockerfile: no such file or directory` (run 33472159405).
# Without this checkout the tag push will always fail.
#
# Triggers
#   - push tags matching `v*`        : real release
#   - workflow_dispatch              : manual dry-run (Actions tab → Run workflow)
#
# Required secrets (only on tag push, NOT on workflow_dispatch dry-run):
#   - (none today) — push job is gated `if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')`.
#     To actually push to GHCR, the runner needs `packages: write` (default for repo on GHE/GHEC).
#
# Image naming (per GA plan §6 M3 tag):
#   ghcr.io/cscoheru/fish-harness:<tag>      (immutable, tag-pinned)
#   ghcr.io/cscoheru/fish-harness:latest    (only on main-merge; not done here — deploy workflow fires on tags only)

name: deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Avoid concurrent deploy runs clobbering the same tag image.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # 1. build + smoke — produce the OCI image AND run the mutation_suite
  #    gate on the SAME runner (P0 fix: image loaded via `load: true`
  #    lives only in this runner's local docker daemon, so the smoke
  #    step must run in this same job before any other runner takes over).
  # ---------------------------------------------------------------------
  build:
    name: Build + smoke (fish-harness:${{ github.ref_name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed by the push job below
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image metadata
        id: meta
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          TAG="${GITHUB_REF_NAME}"
          IMAGE="ghcr.io/${OWNER}/fish-harness"
          echo "image=${IMAGE}"       >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"           >> "$GITHUB_OUTPUT"
          echo "::group::Image metadata"
          echo "  owner : ${OWNER}"
          echo "  image : ${IMAGE}"
          echo "  tag   : ${TAG}"
          echo "::endgroup::"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (load into runner daemon)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

      # ----- P0 smoke: same runner, image in this runner's daemon -----
      - name: Smoke — import check + sqlite ≥ 3.47
        run: |
          docker run --rm \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            python -c "
          from harness.runtime import SqliteWorkerPool, SqliteEventSink, SqliteContextManager
          from harness.gateway import HttpEgressService, ToolInvocationGatewayImpl, RealArtifactStore
          from harness.testing import run_mutations
          import sqlite3, harness
          v = sqlite3.sqlite_version
          assert tuple(map(int, v.split('.'))) >= (3, 47, 0), f'sqlite {v} < 3.47'
          print(f'harness={harness.__version__} sqlite={v}')
          "

      - name: Smoke — mutation_suite v0.9.4 (17/17 reverse-DROP causal-chain)
        run: |
          docker run --rm \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            python -m harness.testing.mutation_suite

  # ---------------------------------------------------------------------
  # 2. push — publish the tag to GHCR (skipped on workflow_dispatch dry-run).
  # ---------------------------------------------------------------------
  push:
    name: Push to GHCR
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tag + latest
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}
            ${{ needs.build.outputs.image }}:latest