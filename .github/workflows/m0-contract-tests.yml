  json-schema-validate:
    name: spec/events/*.json validate as JSON Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema + check-jsonschema
        run: pip install jsonschema check-jsonschema
      - name: Validate every event schema is itself valid
        run: |
          set -e
          for f in spec/events/*.json; do
            [ "$(basename "$f")" = ".gitkeep" ] && continue
            check-jsonschema --check-metaschema "$f" || { echo "invalid schema: $f"; exit 1; }
          done
          echo "OK: all event schemas are valid"

  adr-marker-check:
    name: adr/0001-0007.md exist with status: Accepted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ADRs
        run: |
          set -e
          for n in 0001 0002 0003 0004 0005 0006 0007; do
            test -f "adr/${n}-"*.md || { echo "missing ADR $n"; exit 1; }
            grep -q "Status: Accepted" "adr/${n}-"*.md || { echo "ADR $n not Accepted"; exit 1; }
          done
          echo "OK: 7 ADRs present and Accepted"