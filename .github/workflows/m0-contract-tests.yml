name: M0 contract tests

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "spec/**"
      - "spikes/**"
      - "adr/**"
      - ".github/workflows/m0-contract-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "spec/**"
      - "spikes/**"
      - "adr/**"

jobs:
  schema-applies:
    name: spec/kernel-schema.sql applies to fresh SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sqlite3
        run: sudo apt-get install -y sqlite3
      - name: Apply schema
        run: |
          set -e
          rm -f /tmp/harness-test.sqlite
          sqlite3 /tmp/harness-test.sqlite < spec/kernel-schema.sql
          sqlite3 /tmp/harness-test.sqlite "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;" | tee /tmp/tables.txt
          test "$(wc -l < /tmp/tables.txt)" -ge 10
      - name: Verify v0.9.2 schema counts (13/14/24/27/39)
        run: |
          set -e
          PROJECT_TABLES=$(sqlite3 /tmp/harness-test.sqlite "SELECT count(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%';")
          ALL_TABLES=$(sqlite3 /tmp/harness-test.sqlite "SELECT count(*) FROM sqlite_master WHERE type='table';")
          TRIGGERS=$(sqlite3 /tmp/harness-test.sqlite "SELECT count(*) FROM sqlite_master WHERE type='trigger';")
          NAMED_INDEXES=$(sqlite3 /tmp/harness-test.sqlite "SELECT count(*) FROM sqlite_master WHERE type='index' AND name NOT LIKE 'sqlite_%';")
          ALL_INDEXES=$(sqlite3 /tmp/harness-test.sqlite "SELECT count(*) FROM sqlite_master WHERE type='index';")
          echo "tables(project)=$PROJECT_TABLES tables(total)=$ALL_TABLES triggers=$TRIGGERS indexes(named)=$NAMED_INDEXES indexes(total)=$ALL_INDEXES"
          test "$PROJECT_TABLES" = "13" || { echo "FAIL: expected 13 project tables; got $PROJECT_TABLES"; exit 1; }
          test "$ALL_TABLES" = "14" || { echo "FAIL: expected 14 total tables (incl sqlite_sequence); got $ALL_TABLES"; exit 1; }
          test "$TRIGGERS" = "24" || { echo "FAIL: expected 24 triggers; got $TRIGGERS"; exit 1; }
          test "$NAMED_INDEXES" = "27" || { echo "FAIL: expected 27 named indexes; got $NAMED_INDEXES"; exit 1; }
          test "$ALL_INDEXES" = "39" || { echo "FAIL: expected 39 total indexes; got $ALL_INDEXES"; exit 1; }
          echo "OK: schema counts match v0.9.2 (13 project / 14 incl sqlite_sequence / 24 triggers / 27 named / 39 total)"
      - name: Verify invariants at DB level
        run: |
          set -e
          # Invariant I2: only one active attempt per task
          sqlite3 /tmp/harness-test.sqlite <<'SQL'
          INSERT INTO tasks (task_id, tenant_id, workflow_pack, workflow_version, status)
            VALUES ('t-fence', 'tn', 'web_research', '1.0.0', 'pending');
          INSERT INTO task_attempts (task_id, attempt_id, fence_version, status, driver_kind)
            VALUES ('t-fence', 'a1', 1, 'claimed', 'codex_exec');
          SQL
          # Second active attempt must fail (unique partial index)
          if sqlite3 /tmp/harness-test.sqlite \
              "INSERT INTO task_attempts (task_id, attempt_id, fence_version, status, driver_kind) VALUES ('t-fence','a2',1,'claimed','codex_exec');" 2>/dev/null; then
            echo "FAIL: invariant I2 violated"
            exit 1
          fi
          echo "OK: invariant I2 enforced at DB level"

  spike-py-claim-fence:
    name: spikes/m0/claim-fence-test.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run spike
