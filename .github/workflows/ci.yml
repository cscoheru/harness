# fish-harness v1.0 CI — T-QA-4 3 个新 job (integration-tests / mutation-suite / benchmark-baseline)
#
# Goal: per GA plan §2 T-QA-4, add 3 jobs that exercise the v1.0
# production surface (no spikes/):
#   1. integration-tests — pytest tests/ (T-QA-2 suite, 37 cases)
#   2. mutation-suite    — python -m harness.testing.mutation_suite (17/17)
#   3. benchmark-baseline — runner.py p99 < 5000ms gate, manual trigger only
#
# Triggers
#   - integration-tests + mutation-suite:
#       push (any branch), pull_request, workflow_dispatch
#   - benchmark-baseline:
#       workflow_dispatch ONLY (GA plan §5 R-5: benchmark is opt-in to
#       avoid burning CI minutes on push; explicit dry-run path)
#
# Concurrency: per-job `concurrency` with cancel-in-progress=false so a
# failed re-run doesn't cancel the previous attempt mid-flight.
#
# Python matrix: 3.12 + 3.13 (matches pyproject `requires-python = ">=3.12"`).
# pip caching is automatic through `cache: 'pip'` (key on pyproject.toml hash).
#
# Permissions: `contents: read` only (least privilege — no packages: write
# since this workflow does not push images; that's deploy.yml's job).
#
# Out of scope (this file does NOT touch):
#   - .github/workflows/m0-contract-tests.yml (12 spike jobs)
#   - .github/workflows/deploy.yml (build + push to GHCR; P0 fix from T-QA-1)

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Default to no cancellation — we want to see results of failed runs
# before being clobbered by a re-trigger.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # 1. integration-tests — T-QA-2 pytest suite (37 cases)
  # ---------------------------------------------------------------------
  integration-tests:
    name: integration-tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pytest tests/ -v
        run: |
          set -euo pipefail
          pytest tests/ -v

  # ---------------------------------------------------------------------
  # 2. mutation-suite — reverse-DROP causal-chain (17/17 expected)
  # ---------------------------------------------------------------------
  mutation-suite:
    name: mutation-suite (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mutation_suite v0.9.4
        run: |
          set -euo pipefail
          python -m harness.testing.mutation_suite

  # ---------------------------------------------------------------------
  # 3. benchmark-baseline — runner.py p99 < 5000ms gate (manual only)
  # ---------------------------------------------------------------------
  benchmark-baseline:
    name: benchmark-baseline (py3.12)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # GA plan §5 R-5: benchmark is opt-in to avoid burning CI minutes
    # on every push. workflow_dispatch only.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run benchmark (--tasks=50 --workers=4, p99 < 5000ms gate)
        run: |
          set -euo pipefail
          python -m harness.benchmark.runner \
            --tasks=50 --workers=4 --out results.json

      - name: Verify gate
        run: |
          set -euo pipefail
          python -c "
          import json, sys
          r = json.load(open('results.json'))
          if not r['passes_gate']:
              print(f'BENCHMARK GATE FAILED: p99={r[\"latency_ms\"][\"p99\"]}ms >= 5000ms', file=sys.stderr)
              sys.exit(1)
          print(f'OK: p50={r[\"latency_ms\"][\"p50\"]:.3f}ms '
                f'p95={r[\"latency_ms\"][\"p95\"]:.3f}ms '
                f'p99={r[\"latency_ms\"][\"p99\"]:.3f}ms '
                f'throughput={r[\"throughput_tasks_per_sec\"]:.1f}/s')
          "

      - name: Upload results.json
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: results.json
          if-no-files-found: error
          retention-days: 14