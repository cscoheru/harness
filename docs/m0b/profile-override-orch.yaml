# dsh profile patch — ORCH role (high-reasoning, cross-project decisions)
#
# Stacks on top of profile-override-base.yaml. Sets model to deepseek-v4-pro.
#
# Usage:
#   dsh --profile web \
#     --patch docs/m0b/profile-override-base.yaml \
#     --patch docs/m0b/profile-override-orch.yaml \
#     -- "<research A-class task prompt>"
#
# Per Codex review M3: this yaml is for BE-1 orchestrator-class tasks.
# Per M2: orch → deepseek-v4-pro (class: orch, tier: high-reasoning).

- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-pro
