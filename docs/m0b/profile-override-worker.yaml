# dsh profile patch — WORKER role (low-cost batch execution)
#
# Stacks on top of profile-override-base.yaml. Sets model to deepseek-v4-flash.
#
# Usage:
#   dsh --profile web \
#     --patch docs/m0b/profile-override-base.yaml \
#     --patch docs/m0b/profile-override-worker.yaml \
#     -- "<summary A-class task prompt>"
#
# Per Codex review M3: this yaml is for DO-1 worker-class tasks.
# Per M2: worker → deepseek-v4-flash (class: worker, tier: low-cost-batch).
# RATIONALE: deepseek-v4-flash is the cost-optimal model in DeepSeek's lineup
# for text-only batch work. deepseek-v4-flash-vision-exp is a vision-tuned
# EXPERIMENTAL model — NOT a "low-cost batch" equivalent per PRD-v1.1 §1.5.
# vision-exp is available as an OPTIONAL EXPLORATION ARM only when the task
# requires vision input; it does NOT replace v4-flash as the worker tier.

- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
