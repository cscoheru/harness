<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fish Harness — PWA v1.2.0l (Parallel Dual View)</title>

  <!--
    v1.2.0l NEW: Parallel dual view via dagre-d3.
    Left panel: DAG tree (steps + status icons + arrows) — automatic layout
    Right panel: Selected step's live stdout stream (SSE)

    Tech stack: vanilla HTML + dagre@0.8.5 + d3@7.8.5 + dagre-d3@0.6.4
    (no build step, no React). CDN scripts pin specific versions to dodge
    R8 (jsdelivr outage) — fallback path: drop the 3 vendored files into
    wrapper/orchestrator/static/vendor/ and switch src to local.
  -->

  <script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dagre-d3@0.6.4/dist/dagre-d3.min.js" defer></script>

  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #64748b;
      --success: #4ade80;
      --error: #f87171;
      --warn: #fbbf24;
      --running: #60a5fa;
      --pending: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    header {
      flex: 0 0 auto;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    header h1 {
      font-size: 1.1rem;
      color: var(--accent);
      margin-right: 1rem;
    }

    header select, header input, header textarea, header button {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.85rem;
      padding: 0.4rem 0.6rem;
    }

    header button.primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      cursor: pointer;
      font-weight: 600;
    }

    header .prompt-input {
      flex: 1 1 auto;
      min-width: 200px;
    }

    main {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: 40% 60%;
      min-height: 0;
    }

    .panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-right: 1px solid var(--border);
    }

    .panel:last-child { border-right: none; }

    .panel-header {
      flex: 0 0 auto;
      padding: 0.5rem 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 1rem;
    }

    /* DAG SVG container */
    #dag-svg {
      width: 100%;
      height: 100%;
      background: var(--bg);
    }

    .dag-node rect {
      stroke: var(--border);
      stroke-width: 3;
      fill: var(--surface);
    }

    /* v1.2.0m NEW: host-tinted card backgrounds. The base fill (above) and
       status-* fills (below) set the background; host-* tints OVERRIDE them
       so the user sees at a glance which edge ran each step. Status borders
       (3px) remain visible against the 18% host tint. */
    .dag-node.host-edge2 rect       { fill: rgba(245, 158, 11, 0.18); }  /* amber  */
    .dag-node.host-edge3 rect       { fill: rgba(6, 182, 212, 0.18); }   /* cyan   */
    .dag-node.host-newvps rect      { fill: rgba(236, 72, 153, 0.18); }  /* pink   */
    .dag-node.host-mac rect         { fill: rgba(168, 85, 247, 0.18); }  /* purple */
    .dag-node.host-edge1 rect       { fill: rgba(132, 204, 22, 0.18); }  /* lime   */
    .dag-node.host-unknown rect     { fill: var(--surface); }            /* fallback */

    .dag-node.status-pending rect { stroke: var(--pending); }
    .dag-node.status-running rect { stroke: var(--running); }
    .dag-node.status-completed rect { stroke: var(--success); }
    .dag-node.status-failed rect { stroke: var(--error); }

    .dag-node text {
      fill: var(--text);
      font-size: 12px;
      font-family: system-ui, sans-serif;
    }

    .dag-node text.status-icon {
      font-size: 14px;
      font-weight: 700;
    }

    .dag-edge path {
      stroke: var(--muted);
      stroke-width: 2;
      fill: none;
    }

    /* Stdout panel */
    .stdout-meta {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .stdout-meta .pill {
      display: inline-block;
      padding: 0.1rem 0.4rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-right: 0.4rem;
      color: var(--text);
    }

    .stdout-body {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      max-height: calc(100vh - 220px);
      overflow: auto;
    }

    .empty-state {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 2rem;
      text-align: center;
    }

    /* Toast for errors */
    .toast {
      position: fixed;
      top: 60px;
      right: 1rem;
      background: var(--error);
      color: var(--bg);
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      z-index: 999;
      max-width: 320px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Fish Harness</h1>
    <select id="workflow-pack">
      <option value="orch">orch — Real 3-layer orchestration</option>
      <option value="default">default</option>
    </select>
    <input
      id="prompt-input"
      class="prompt-input"
      type="text"
      placeholder='e.g. "启动 2 个 worker 并发出 hello 指令"'
      value="启动 2 个 worker 并发出 hello 指令"
    />
    <button class="primary" id="dispatch-btn">Dispatch</button>
    <span id="task-id" style="color: var(--muted); font-size: 0.75rem;"></span>
  </header>

  <main>
    <section class="panel">
      <div class="panel-header">
        <span>DAG</span>
        <span id="dag-status"></span>
      </div>
      <div class="panel-body" id="dag-container">
        <svg id="dag-svg" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="dag-empty" class="empty-state">
          DAG 会在这里渲染 — dispatch 一个 task 后即可看到步骤拓扑
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <span>Selected Step</span>
        <span id="step-status"></span>
      </div>
      <div class="panel-body">
        <div id="step-meta" class="stdout-meta">
          <span class="pill">—</span>  ← 在左边 DAG 里点击节点
        </div>
        <pre id="step-stdout" class="stdout-body"></pre>
      </div>
    </section>
  </main>

  <script>
    // ─── State ─────────────────────────────────────────────────────────────
    const state = {
      taskId: null,
      steps: [],            // [{name, capability, status, worker_id, host, stdout, ...}]
      hosts: [],
      selectedStep: null,
      eventSource: null,
      dagreGraph: null,
      dagreSvg: null,
      dagreRender: null,    // dagre-d3 render fn once libs load
    };

    const STATUS_ICONS = {
      pending: "○",
      running: "⚡",
      completed: "✓",
      failed: "✗",
      cancelled: "⊘",
    };

    // v1.2.0m NEW: derive a CSS class from a step's host FQDN so the DAG
    // card gets a host-distinctive background tint. The full FQDN like
    // "edge2.fish-harness.ts.net" becomes "host-edge2" (matches the
    // .dag-node.host-edge2 CSS rules above). Falls back to "host-unknown"
    // for hosts without a registered tint.
    function hostClass(host) {
      if (!host || typeof host !== "string") return "host-unknown";
      const label = host.split(".")[0];
      return `host-${label}`;
    }

    // ─── DOM refs ──────────────────────────────────────────────────────────
    const $dagSvg = document.getElementById("dag-svg");
    const $dagContainer = document.getElementById("dag-container");
    const $dagEmpty = document.getElementById("dag-empty");
    const $dagStatus = document.getElementById("dag-status");
    const $stepMeta = document.getElementById("step-meta");
    const $stepStdout = document.getElementById("step-stdout");
    const $stepStatus = document.getElementById("step-status");
    const $taskId = document.getElementById("task-id");
    const $dispatchBtn = document.getElementById("dispatch-btn");
    const $workflowPack = document.getElementById("workflow-pack");
    const $promptInput = document.getElementById("prompt-input");

    // ─── DAG render via dagre-d3 ───────────────────────────────────────────
    function waitForLibs() {
      return new Promise((resolve) => {
        const check = () => {
          if (typeof d3 !== "undefined" && typeof dagre !== "undefined" && typeof dagreD3 !== "undefined") {
            resolve();
          } else {
            setTimeout(check, 30);
          }
        };
        check();
      });
    }

    async function renderDag() {
      if (!state.steps.length) {
        $dagEmpty.style.display = "block";
        d3.select($dagSvg).selectAll("*").remove();
        return;
      }
      $dagEmpty.style.display = "none";
      await waitForLibs();

      // Build a fresh dagre graph each render — small DAG (≤10 steps typical)
      const g = new dagre.graphlib.Graph({ directed: true });
      g.setGraph({
        rankdir: "LR",
        nodesep: 30,
        ranksep: 60,
        marginx: 20,
        marginy: 20,
      });
      g.setDefaultEdgeLabel(() => ({}));

      // Map step.name → PlanStep for dependency lookup
      const stepMap = Object.fromEntries(state.steps.map((s) => [s.name, s]));

      // Nodes
      state.steps.forEach((step) => {
        const icon = STATUS_ICONS[step.status] ?? "?";
        // v1.2.0l.2 FIX: don't set `class:` here — dagre-d3 applies class to BOTH
        // the wrapper <g> it creates AND our inner label <g>, which makes
        // selectAll('.dag-node') match 2 elements per step (the "6 nodes for
        // 3 steps" bug observed 2026-09-15). Class is set on the inner <g>
        // by setAttribute below; outer wrapper is untagged.
        g.setNode(step.name, {
          label: () => {
            const node = document.createElementNS("http://www.w3.org/2000/svg", "g");
            // v1.2.0m NEW: include host class so CSS tints the rect background.
            // Combined classes: dag-node + status-<status> + host-<label>.
            node.setAttribute("class", `dag-node status-${step.status} ${hostClass(step.host)}`);
            node.setAttribute("data-step", step.name);

            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttribute("width", "200");
            rect.setAttribute("height", "56");
            rect.setAttribute("rx", "6");
            node.appendChild(rect);

            const iconText = document.createElementNS("http://www.w3.org/2000/svg", "text");
            iconText.setAttribute("class", "status-icon");
            iconText.setAttribute("x", "12");
            iconText.setAttribute("y", "22");
            iconText.textContent = icon;
            node.appendChild(iconText);

            const nameText = document.createElementNS("http://www.w3.org/2000/svg", "text");
            nameText.setAttribute("x", "32");
            nameText.setAttribute("y", "22");
            nameText.textContent = step.name;
            node.appendChild(nameText);

            const capText = document.createElementNS("http://www.w3.org/2000/svg", "text");
            capText.setAttribute("x", "12");
            capText.setAttribute("y", "42");
            capText.setAttribute("fill", "var(--muted)");
            capText.setAttribute("font-size", "10");
            capText.textContent = `capability: ${step.capability ?? "—"}`;
            node.appendChild(capText);

            const hostText = document.createElementNS("http://www.w3.org/2000/svg", "text");
            hostText.setAttribute("x", "12");
            hostText.setAttribute("y", "54");
            hostText.setAttribute("fill", "var(--muted)");
            hostText.setAttribute("font-size", "10");
            hostText.textContent = `host: ${step.host ?? "—"}`;
            node.appendChild(hostText);

            // Click → select step
            node.addEventListener("click", () => selectStep(step.name));
            return node;
          },
          paddingLeft: 8,
          paddingRight: 8,
          paddingTop: 8,
          paddingBottom: 8,
          width: 200,
          height: 56,
        });
      });

      // Edges — build from per-step dependency list. PackManifest default_plan
      // doesn't carry depends_on in status response, so we infer from step
      // index order (topological) — sufficient for the orch.json 3-step DAG.
      for (let i = 0; i < state.steps.length - 1; i++) {
        g.setEdge(state.steps[i].name, state.steps[i + 1].name, { class: "dag-edge" });
      }

      // Render
      const render = new dagreD3.render();
      const svg = d3.select($dagSvg);
      svg.selectAll("*").remove();
      svg.attr("viewBox", null);
      const inner = svg.append("g");
      render(inner, g);
      // Size to content
      const bbox = inner.node().getBBox();
      svg.attr("viewBox", `${bbox.x - 10} ${bbox.y - 10} ${bbox.width + 20} ${bbox.height + 20}`);
      svg.attr("preserveAspectRatio", "xMidYMid meet");

      state.dagreGraph = g;
      state.dagreSvg = svg;
      state.dagreRender = render;
    }

    function setNodeClass(stepName, status, host) {
      if (!state.dagreSvg) return;
      // v1.2.0m FIX: preserve host-* class when updating status. Without
      // this the host tint disappears the moment the first step_update
      // arrives (because the previous implementation set only "dag-node
      // status-<status>", stripping the host class added at render time).
      const h = host ?? state.steps.find((s) => s.name === stepName)?.host ?? null;
      state.dagreSvg
        .selectAll(`g.dag-node[data-step="${stepName}"]`)
        .attr("class", `dag-node status-${status} ${hostClass(h)}`);
      // Update icon text
      const icon = STATUS_ICONS[status] ?? "?";
      state.dagreSvg
        .selectAll(`g.dag-node[data-step="${stepName}"] text.status-icon`)
        .text(icon);
    }

    // ─── Step selection + stdout panel ──────────────────────────────────────
    function selectStep(stepName) {
      state.selectedStep = stepName;
      const step = state.steps.find((s) => s.name === stepName);
      if (!step) return;
      $stepMeta.innerHTML = `
        <span class="pill">${step.name}</span>
        <span class="pill">capability: ${step.capability ?? "—"}</span>
        <span class="pill">host: ${step.host ?? "—"}</span>
        <span class="pill">worker: ${step.worker_id ?? "—"}</span>
        <span class="pill">status: ${step.status}</span>
        ${step.wallMs != null ? `<span class="pill">wallMs: ${step.wallMs}</span>` : ""}
      `;
      $stepStdout.textContent = step.stdout ?? "";
      $stepStatus.textContent = `${STATUS_ICONS[step.status] ?? "?"} ${step.status}`;
    }

    // ─── SSE stream ─────────────────────────────────────────────────────────
    function openSse(taskId) {
      if (state.eventSource) {
        state.eventSource.close();
      }
      const es = new EventSource(`/api/v1/status/${encodeURIComponent(taskId)}/stream`);
      state.eventSource = es;

      es.addEventListener("snapshot", (ev) => {
        const data = JSON.parse(ev.data);
        state.steps = data.steps ?? [];
        state.hosts = data.hosts ?? [];
        state.taskId = taskId;
        $taskId.textContent = `task: ${taskId.slice(0, 12)}…`;
        renderDag();
        // Auto-select the step that surfaces the most info on snapshot — for
        // orch.json, dispatch-commands shows both commander outputs (19, 7).
        if (!state.selectedStep && state.steps.length > 0) {
          const preferred = state.steps.find((s) => s.name === "dispatch-commands") ??
            state.steps.find((s) => s.name === "aggregate-results") ??
            state.steps[0];
          selectStep(preferred.name);
        }
        updateStatusBadge();
      });

      es.addEventListener("step_update", (ev) => {
        const data = JSON.parse(ev.data);
        const step = state.steps.find((s) => s.name === data.step);
        if (step) {
          Object.assign(step, data);
          setNodeClass(step.name, step.status, data.host ?? step.host);
          if (state.selectedStep === step.name) {
            selectStep(step.name); // refresh right panel
          }
        }
        updateStatusBadge();
      });

      // v1.2.0m NEW: live stdout streaming. Server emits "stdout_chunk"
      // via emitStepUpdate(kind="stdout_chunk", { chunk }) and SSE forwards
      // it as a step_update event with kind="stdout_chunk". Append the
      // chunk to the right panel only when the matching step is selected,
      // so we don't fight DOM updates for non-selected cards.
      es.addEventListener("stdout_chunk", (ev) => {
        try {
          const data = JSON.parse(ev.data);
          const step = state.steps.find((s) => s.name === data.step);
          if (step) {
            // Mirror server-side accumulate (commander.appendStepStdout uses
            // .slice(-STEP_STDOUT_CAP)). Keep PWA buffer bounded the same way.
            const STEP_STDOUT_CAP = 256 * 1024;
            step.stdout = ((step.stdout ?? "") + String(data.chunk ?? "")).slice(-STEP_STDOUT_CAP);
            if (state.selectedStep === step.name) {
              $stepStdout.textContent = step.stdout;
            }
          }
        } catch (err) {
          console.warn("[sse] stdout_chunk parse error", err);
        }
      });

      es.addEventListener("task_completed", (ev) => {
        const data = JSON.parse(ev.data);
        updateStatusBadge();
        es.close();
        state.eventSource = null;
      });

      es.onerror = () => {
        // Browser will auto-reconnect; just log
        console.warn("[sse] connection error");
      };
    }

    function updateStatusBadge() {
      const total = state.steps.length;
      const completed = state.steps.filter((s) => s.status === "completed").length;
      const failed = state.steps.filter((s) => s.status === "failed").length;
      $dagStatus.textContent = `${completed}/${total} done${failed ? ` · ${failed} failed` : ""}`;
    }

    // ─── Dispatch ──────────────────────────────────────────────────────────
    async function dispatchTask() {
      const prompt = $promptInput.value.trim();
      if (!prompt) return;
      const pack = $workflowPack.value;

      $dispatchBtn.disabled = true;
      $dispatchBtn.textContent = "Dispatching…";

      try {
        const res = await fetch("/api/v1/tasks", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt, workflowPack: pack }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: res.statusText }));
          toast(`Dispatch failed: ${err.error ?? res.statusText}`);
          return;
        }
        const data = await res.json();
        state.taskId = data.task_id;
        $taskId.textContent = `task: ${data.task_id.slice(0, 12)}…`;
        // Reset DAG
        state.steps = [];
        state.selectedStep = null;
        $stepMeta.innerHTML = '<span class="pill">—</span>  ← 等 DAG 渲染';
        $stepStdout.textContent = "";
        renderDag();
        // Open SSE
        openSse(data.task_id);
      } catch (err) {
        toast(`Dispatch exception: ${err.message ?? err}`);
      } finally {
        $dispatchBtn.disabled = false;
        $dispatchBtn.textContent = "Dispatch";
      }
    }

    function toast(msg) {
      const el = document.createElement("div");
      el.className = "toast";
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    $dispatchBtn.addEventListener("click", dispatchTask);
    $promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") dispatchTask();
    });

    // Initial load: check if there's already an active task via ?task_id=
    const urlParams = new URLSearchParams(location.search);
    const initialTask = urlParams.get("task_id");
    if (initialTask) {
      state.taskId = initialTask;
      openSse(initialTask);
    }
  </script>
</body>
</html>
