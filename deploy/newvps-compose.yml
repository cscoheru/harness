# deploy/newvps-compose.yml — fish-harness v1.1 M1c Stage 1 (T-M1c-DO-1)
#
# Topology: newvps co-located (1 wrapper orchestrator + 1 kernel + 1 worker)
# Security:  Tailscale-only; no public ports except Tailscale 443
# Runtime:   v1.0 harness container is FROZEN — image tag = 1.0.0, no edits
#
# M1c 扩 (vs M0c):
#   - 加 wrapper 容器（TypeScript orchestrator，暴露 3000 端口）
#   - 加 PWA server 端口映射（3000 → host）供 Tailscale Serve 代理
#   - 加 tailscale_net（attach Tailscale 容器网络）
#
# References:
#   - PRD-v1.1 §4.1: Tailscale-only (no Basic Auth, no public HTTPS)
#   - PRD-v1.1 §4.2: newvps co-located (M1); RAM margin 3.5x PASS (M0b DO-1)
#   - ADR 0010 Decision (d): v1.0 runtime 0-diff gate
#   - DISPATCH-T-M1c-DO-1 §3: wrapper 容器 + PWA port 3000
#
# Constraints (铁律):
#   - ❌ No public ports (only Tailscale 443 inbound)
#   - ❌ No hard-coded API keys (env-inject only; ${VAR} substitution)
#   - ❌ Do NOT edit v1.0 harness container image / Dockerfile
#   - ❌ Do NOT pin specific model SKU (use class fields)
#   - ❌ Do NOT deploy from this file (subagent writes only; real deploy = user ssh)

services:
  # ── v1.0 runtime kernel (FROZEN) ──────────────────────────────────────────
  # Image is the GA release; tag 1.0.0 = frozen contract.
  # Volumes:
  #   - harness_db: shared SQLite WAL (ADR 0009: SINGLE-HOST only)
  #   - ./spec:/app/spec:ro: protocol spec (source of truth)
  harness-kernel:
    image: ghcr.io/cscoheru/fish-harness:1.0.0
    container_name: harness-kernel
    restart: unless-stopped
    volumes:
      - harness_db:/data
    env_file:
      - ../env/newvps.env.example
    environment:
      # Harness kernel listens on this internal port inside the compose network.
      # Tailscale Serve proxies harness.rana.asia:443 → wrapper:3000 (not kernel:8000).
      # Kernel still runs internally but is not directly exposed.
      HARNESS_PORT: "8000"
    networks:
      - harness_net
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; c=sqlite3.connect('/data/harness.db'); c.close(); print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    memswap_limit: 512m
    # No ports: only Tailscale Serve (via wrapper) reaches this service.

  # ── TypeScript wrapper orchestrator (M0c skeleton → M1c 实装) ─────────────
  # Wraps the harness kernel with orchestrator / commander logic.
  # Exposes port 3000 for Tailscale Serve HTTPS reverse proxy.
  # Entrypoint: npm run dev or npm start (M1c BE-1 + TG-1 产出)
  wrapper:
    container_name: harness-wrapper
    image: node:22-slim
    restart: unless-stopped
    working_dir: /app/wrapper
    volumes:
      - ..:/app:ro
    env_file:
      - ../env/newvps.env.example
    environment:
      # Points to the harness-kernel service inside the compose network.
      HARNESS_API_URL: "http://harness-kernel:8000"
      # PWA server listens on port 3000 inside container (port mapping 3010:3000).
      # 3010 is the HOST port exposed to Tailscale Funnel.
      WRAPPER_PORT: "3000"
      WORKER_ID: "${WORKER_ID:-worker-001}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      # Orchestrator class — not a specific SKU.
      ORCHESTRATOR_CLASS: "orchestrator"
      # dsh profile: MUST be 'headless' (per M0b QA-1 §6.X 教训; web = Web UI server)
      DSH_PROFILE: "headless"
    networks:
      - harness_net
    depends_on:
      harness-kernel:
        condition: service_healthy
    # Port 3010 (host) → 3000 (container). 3010 chosen because 3000 is occupied
    # by next-server (puer-hub dev server). Tailscale Funnel proxies
    # harness.rana.asia:443 → wrapper:3010.
    ports:
      - "3010:3000"
    command: ["node", "build/server.js"]
    mem_limit: 512m
    memswap_limit: 512m

  # ── 1 worker (background task consumer) ────────────────────────────────────
  # Worker picks up tasks from the wrapper orchestrator layer.
  # newvps co-located (RAM margin 3.5x verified by M0b DO-1).
  # class: worker (not a specific SKU — NORTH-STAR A-4 equivalence class)
  worker:
    container_name: harness-worker
    image: node:22-slim
    restart: unless-stopped
    working_dir: /app/wrapper
    volumes:
      - ..:/app:ro
    env_file:
      - ../env/newvps.env.example
    environment:
      HARNESS_API_URL: "http://harness-kernel:8000"
      WRAPPER_API_URL: "http://wrapper:3000"
      WORKER_ID: "${WORKER_ID:-worker-001}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      # Worker class — not a specific model SKU.
      WORKER_CLASS: "worker"
      # dsh profile: MUST be 'headless' (per M0b QA-1 §6.X)
      DSH_PROFILE: "headless"
    networks:
      - harness_net
    depends_on:
      wrapper:
        condition: service_started
    # Real worker entry — M2 spec (post PROJECT_ROOT fix; volume = .. mount).
    command: ["node", "build/server.js"]
    mem_limit: 512m
    memswap_limit: 512m
    # No ports: worker is a background consumer, not a server.

  # ── PWA frontend server (Option B per D-9) ────────────────────────────────
  # Separate container running pwa_server.ts: serves the 288-line vanilla JS
  # PWA from wrapper/orchestrator/static/ + its own /api/pwa/{dispatch,status}
  # routes (used by the form in the PWA). Mapped to host port 3001.
  # Tailscale Funnel path routing:
  #   /api/v1/* → wrapper:3000 (API-only; per D-9 server.ts no SPA fallback)
  #   /*        → frontend:3001 (PWA + /api/pwa/* form handlers)
  frontend:
    container_name: harness-frontend
    image: node:22-slim
    restart: unless-stopped
    working_dir: /app/wrapper
    volumes:
      - ..:/app:ro
    env_file:
      - ../env/newvps.env.example
    environment:
      # pwa_server calls orchestrator which calls kernel — same network path
      # as wrapper, just different namespace.
      HARNESS_RUNTIME_URL: "http://harness-kernel:8000"
      WRAPPER_API_URL: "http://wrapper:3000"
      # pwa_server port (container-internal; host-mapped below).
      PWA_PORT: "3000"
      # dsh profile: headless (per M0b QA-1 §6.X).
      DSH_PROFILE: "headless"
    networks:
      - harness_net
    depends_on:
      wrapper:
        condition: service_started
    # Real PWA entry: serves static/index.html + /api/pwa/* routes.
    # Port 3011 (host) chosen because 3001 is occupied by rana-portal.
    # Tailscale Funnel proxies Funnel URL /* → harness-frontend:3011.
    command: ["node", "build/orchestrator/pwa_server.js"]
    mem_limit: 384m
    memswap_limit: 384m
    ports:
      - "3011:3000"

networks:
  harness_net:
    driver: bridge
    # No external exposure — only Tailscale Serve (via wrapper:3000) reaches newvps.
    # Internal compose network routes all inter-service traffic.

volumes:
  harness_db:
    # ADR 0009: SQLite WAL is single-host only.
    # DO NOT expose via NFS or shared filesystem.
