# deploy/6host-compose.newvps.yml — fish-harness v1.1 M2 Stage (T-M2-DO-1)
#
# Topology: newvps co-located — kernel + STT worker + Web Push gateway + 3 wrapper profiles
# Security:  Tailscale-only; no public ports except Tailscale Funnel HTTPS (443)
# Runtime:   v1.0 harness kernel container is FROZEN — image tag = 1.0.0
#
# M2 扩 (vs M1c newvps-compose.yml):
#   - 加 stt-worker: whisper.cpp audio→text (仅 newvps; 边缘 host 无 STT)
#   - 加 web-push-gateway: Web Push VAPID gateway (仅 newvps; VAPID 私钥集中)
#   - wrapper 拆为 3 profiles: orchestrator(:4000) / commander(:4001) / frontend(:4002)
#   - ports: 8000(kernel) / 8080(stt) / 8081(push) / 4000+4001+4002(wrapper)
#
# References:
#   - PRD-v1.1 §3 M2: 6 host distributed (1 newvps + 5 edge)
#   - PRD-v1.1 §4.1: Tailscale-only
#   - ADR 0010 Decision (d): v1.0 runtime 0-diff gate
#   - DISPATCH-T-M2-DO-1 §3: 6 host compose
#   - codex-audit-scope §4.5: container IP 不锁; MagicDNS 跨 host
#   - codex-audit-scope §4.6: STT 守门 (WHISPER_MODEL_PATH 绝对路径; /dev/shm only)
#   - codex-audit-scope §4.7: Web Push VAPID 私钥 env-inject only
#
# Constraints (铁律):
#   - No hard-coded API keys (env-inject only)
#   - Do NOT edit v1.0 harness kernel image / Dockerfile
#   - Do NOT pin specific model SKU (use class fields)
#   - VAPID_PRIVATE_KEY: env-inject only (do NOT commit real key)
#   - WHISPER_MODEL_PATH: absolute path only
#   - Container inter-connect: use container_name (no pinned IP)
#   - STT worker: newvps only (no whisper on edge hosts)
#   - Web Push gateway: newvps only (VAPID private key centralized)
# Co-Authored-By: Claude Code <noreply@anthropic.com>

services:
  # ── v1.0 runtime kernel (FROZEN) ───────────────────────────────────────────
  harness-kernel:
    image: ghcr.io/cscoheru/fish-harness:1.0.0
    container_name: harness-kernel
    # v1.2.0g NEW per G6 (harness-kernel restart loop fix): replaced
    # `unless-stopped` with `on-failure:3`. Root cause per v1.2.0f E3
    # discovery 2026-09-10: kernel Status=Restarting (0) 38s ago,
    # exitCode=0 (clean exit), 17h ~1610 cycles @ ~38s/cycle. Kernel exits
    # cleanly by design (frozen v1.0 runtime per ADR 0010), but
    # `unless-stopped` triggered immediate restart on every exit → runaway
    # loop. `on-failure:3` caps at 3 restart attempts before entering
    # `stopped` state. Tradeoffs: (1) host reboot does NOT auto-restart
    # kernel (manual `docker start harness-kernel` needed; rare); (2) actual
    # kernel crashes (exitCode != 0) still restart up to 3 times before
    # giving up. Other services below retain `unless-stopped` — they're
    # stable 17h with no loop symptom (per v1.2.0f F1 deploy verification).
    restart: on-failure:3
    volumes:
      - harness_db:/data
    env_file:
      - env/newvps.env.example
    environment:
      HARNESS_PORT: "8000"
    networks:
      - harness_net
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; c=sqlite3.connect('/data/harness.db'); c.close(); print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.5"
    # v1.2.0d NEW per D7 + F23: kernel smoke limit (kernel 仅 print version
    # + exit by design per ADR 0010 Decision d; 256M is generous ceiling)
    stop_grace_period: 30s
    # No host ports: internal only via compose network

  # ── STT worker (M2 newvps only; whisper.cpp audio→text) ─────────────────────
  stt-worker:
    container_name: harness-stt-worker
    image: node:24-slim
    restart: unless-stopped
    working_dir: /app/wrapper
    volumes:
      - ..:/app:ro
      - whisper_model:/models
    env_file:
      - env/newvps.env.example
    environment:
      HARNESS_API_URL: "http://harness-kernel:8000"
      WRAPPER_API_URL: "http://wrapper-orchestrator:4000"
      WORKER_ID: "${WORKER_ID:-stt-worker-001}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      STT_CLASS: "stt-worker"
      DSH_PROFILE: "headless"
      # whisper.cpp model: absolute path only (hygiene §4.6)
      # Default uses /opt/whisper-models/ (set by env WHISPER_MODEL_PATH at deploy time)
      WHISPER_MODEL_PATH: "${WHISPER_MODEL_PATH}"
      # Audio stream: /dev/shm only (hygiene §4.6 — no disk persistence)
      AUDIO_TEMP_DIR: "/dev/shm/audio"
    networks:
      - harness_net
    depends_on:
      harness-kernel:
        condition: service_started
    command: ["node", "build/server.js"]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: "1.5"
    # v1.2.0d NEW per D7 + F27: stt 2G (whisper.cpp) + 30s graceful drain
    # whisper.cpp CPU-bound; no host ports needed

  # ── Web Push gateway (M2 newvps only; VAPID private key centralized) ─────────
  web-push-gateway:
    container_name: harness-web-push
    image: node:24-slim
    restart: unless-stopped
    working_dir: /app/wrapper
    volumes:
      - ..:/app:ro
    env_file:
      - env/newvps.env.example
    environment:
      HARNESS_API_URL: "http://harness-kernel:8000"
      PUSH_PORT: "8081"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-placeholder}"
      # VAPID_PRIVATE_KEY: env-inject only (hygiene §4.7 — never commit real key)
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY}"
      VAPID_MAILTO: "${VAPID_MAILTO:-mailto:admin@rana.asia}"
    networks:
      - harness_net
    depends_on:
      harness-kernel:
        condition: service_started
    ports:
      - "8081:8081"
    command: ["node", "build/server.js"]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "0.5"
    # v1.2.0d NEW per D7 + F27: web-push 1G + 30s graceful drain

  # ── wrapper orchestrator (port 4000) ─────────────────────────────────────────
  wrapper-orchestrator:
    container_name: harness-wrapper-orch
    image: node:24-slim
    restart: unless-stopped
    working_dir: /app/wrapper
    volumes:
      - ..:/app:ro
      # worker_pool SQLite at /data/worker_pool.db (hardcoded path) — persist
      # across container recreations so registered edge workers survive restarts
      - orch_pool:/data
    # Bridge containers skip the host's systemd-resolved stub (127.0.0.53);
    # point at tailscaled's local MagicDNS resolver. 6host_router speaks
    # *.fish-harness.ts.net but the real tailnet suffix is tail1b9878.ts.net —
    # extra_hosts (values via --env-file) bridges the two until the rename.
    dns:
      - 100.100.100.100
      # v1.2.0d NEW: Tailscale MagicDNS (100.100.100.100) only resolves
      # tailnet names; add public DNS so wrapper containers can reach
      # api.deepseek.com via DEEPSEEK_HTTP direct call (D16).
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "newvps.fish-harness.ts.net:${TS_NEWVPS_IP}"
      - "edge1.fish-harness.ts.net:${TS_EDGE1_IP}"
      - "edge2.fish-harness.ts.net:${TS_EDGE2_IP}"
      - "edge3.fish-harness.ts.net:${TS_EDGE3_IP}"
    env_file:
      - env/newvps.env.example
    environment:
      HARNESS_API_URL: "http://harness-kernel:8000"
      WRAPPER_PORT: "4000"
      WORKER_ID: "${WORKER_ID:-wrapper-orchestrator}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      ORCHESTRATOR_CLASS: "orchestrator"
      DSH_PROFILE: "headless"
    networks:
      - harness_net
    depends_on:
      harness-kernel:
        condition: service_started
    ports:
      - "4000:4000"
    command: ["node", "build/server.js"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "0.5"

  # ── wrapper commander (port 4001) ─────────────────────────────────────────────
  wrapper-commander:
    container_name: harness-wrapper-commander
    image: node:24-slim
    restart: unless-stopped
    working_dir: /app/wrapper
    volumes:
      - ..:/app:ro
    env_file:
      - env/newvps.env.example
    environment:
      HARNESS_API_URL: "http://harness-kernel:8000"
      WRAPPER_PORT: "4001"
      WORKER_ID: "${WORKER_ID:-wrapper-commander}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      ORCHESTRATOR_CLASS: "commander"
      DSH_PROFILE: "headless"
    networks:
      - harness_net
    depends_on:
      harness-kernel:
        condition: service_started
    ports:
      - "4001:4001"
    command: ["node", "build/server.js"]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "1.0"
    # v1.2.0d NEW per D7 + F27: wrapper-commander 1G (3 commanders × 1G) + 30s graceful drain

  # ── wrapper commander-2 (port 4003) — 3host deploy: orch + 2 commanders ──────
  # User directive 2026-09-07: mobilize workers via orchestrator + 2 commanders.
  # Same profile as wrapper-commander on a second port; PRD A-2 (GA ≥3) still
  # tracks a third commander for later.
  wrapper-commander-2:
    container_name: harness-wrapper-commander-2
    image: node:24-slim
    restart: unless-stopped
    working_dir: /app/wrapper
    volumes:
      - ..:/app:ro
    env_file:
      - env/newvps.env.example
    environment:
      HARNESS_API_URL: "http://harness-kernel:8000"
      WRAPPER_PORT: "4003"
      WORKER_ID: "wrapper-commander-2"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      ORCHESTRATOR_CLASS: "commander"
      DSH_PROFILE: "headless"
    networks:
      - harness_net
    depends_on:
      harness-kernel:
        condition: service_started
    ports:
      - "4003:4003"
    command: ["node", "build/server.js"]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "1.0"

  # ── wrapper frontend/PWA (port 4002) — D-9 Option B: real PWA ──────────────
  # Repurposed from server.ts placeholder to pwa_server.ts (D-9 Option B):
  # serves the 288-line vanilla JS PWA from wrapper/orchestrator/static/ +
  # its own /api/pwa/{dispatch,status} form routes.
  # Tailscale Funnel path routing on this host:
  #   /api/v1/* → wrapper-orchestrator:4000 (API-only; no SPA fallback)
  #   /*        → wrapper-frontend:4002 (PWA + /api/pwa/* form handlers)
  wrapper-frontend:
    container_name: harness-wrapper-frontend
    image: node:24-slim
    restart: unless-stopped
    working_dir: /app/wrapper
    volumes:
      - ..:/app:ro
    env_file:
      - env/newvps.env.example
    environment:
      HARNESS_RUNTIME_URL: "http://harness-kernel:8000"
      WRAPPER_API_URL: "http://wrapper-orchestrator:4000"
      PWA_PORT: "4002"
      WORKER_ID: "${WORKER_ID:-wrapper-frontend}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      ORCHESTRATOR_CLASS: "frontend"
      DSH_PROFILE: "headless"
    networks:
      - harness_net
    depends_on:
      harness-kernel:
        condition: service_started
    ports:
      - "4002:4002"
    # Real PWA entry: serves static/index.html + /api/pwa/* routes.
    command: ["node", "build/orchestrator/pwa_server.js"]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "0.5"
    # v1.2.0d NEW per D7 + F27: wrapper-frontend 1G + 30s graceful drain

networks:
  harness_net:
    # v1.2.0e.1 NEW per D3: rename to `deploy_harness_net` (shared external
    # network) so monitoring/docker-compose.yml's prometheus container can
    # reach wrapper via the same network. Without `external: true` and the
    # shared name, prometheus in monitoring_net cannot scrape wrapper on
    # :4000/:4001 — each compose file creates its own local bridge by
    # default. Run `docker network create --driver bridge deploy_harness_net`
    # once on the host before bringing up these stacks.
    name: deploy_harness_net
    driver: bridge
    external: true
    # No external exposure; Tailscale Funnel provides HTTPS entrypoint

volumes:
  harness_db:
    # ADR 0009: SQLite WAL is single-host only (newvps only; not shared)
  whisper_model:
    # whisper.cpp GGML model files (absolute path; shared read-only)
  orch_pool:
    # orchestrator worker_pool SQLite (/data/worker_pool.db) — survives recreate
