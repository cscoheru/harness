# fish-harness v1.2.0f monitoring config (per F1 + L21).
#
# Why this exists (per plan §2 D + §3 U5):
#   - 8 scrape jobs: newvps ×4 + edge1/2/3 + prometheus self
#   - 3 alert rules: memory > 80% / queue > 100 / worker offline > 5min
#   - Tailscale bind (per F28): tag:admin / tag:monitor reach this file
#
# v1.2.0e.1 hotfix (per U5 verification 2026-09-09): scrape targets use the
# REAL Tailscale tailnet suffix `tail1b9878.ts.net` for edge hosts. newvps-
# internal targets use docker container_name (resolved via deploy_harness_net
# shared network DNS per v1.2.0e.1 D3). MagicDNS only auto-resolves the
# `*.<tailnet>.ts.net` suffix; the custom `fish-harness.ts.net` was never
# delegated via split DNS. Long-term fix (v1.2.0g+) is split DNS admin toggle
# per L1.
#
# v1.2.0f NEW (per F1 + L21): scrape_configs switched from inline static_configs
# (with hardcoded container IPs like 172.25.0.6:4000) to `file_sd_configs`
# pointing at deploy/monitoring/targets/*.json. Each JSON file declares one
# job's targets. Adding a new wrapper host = drop a new JSON file + commit.
# Prom watches the directory every 15s (refresh_interval) and auto-picks up
# changes without restart. Container IPs no longer pinned — when docker
# compose restarts and renumbers the bridge, no manual config update needed.
# This closes the long-standing TODO at the bottom of this file.
#
# Deploy: `docker compose -f deploy/monitoring/docker-compose.yml up -d`
# Self-test: `curl http://newvps.tail1b9878.ts.net:9090/metrics`

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: fish-harness
    cycle: v1.2.0f

# ── Alert rules (3 per D9) ─────────────────────────────────────────────────
rule_files:
  - alerts.yml

# ── Scrape configs (file_sd_configs per F1) ────────────────────────────────
# v1.2.0f NEW: all wrapper jobs (newvps ×4 + 5 edges) moved to file_sd_configs.
# Each *.json file under /etc/prometheus/targets/ declares one job. Adding a
# host = drop a JSON file; prometheus auto-discovers within 15s.
# Edge hosts use Tailscale MagicDNS (tail1b9878.ts.net); newvps containers
# use docker container_name resolved via the shared deploy_harness_net bridge.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          host: prometheus

  # All other jobs use file_sd_configs (per F1).
  # Targets directory mounted at /etc/prometheus/targets/ via
  # deploy/monitoring/docker-compose.yml volume block.
  - job_name: file_sd_discovery
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        # Refresh every 15s (matches global scrape_interval). When a JSON
        # file is added/removed/modified, prometheus re-reads on the next
        # refresh tick without restart. The targets inherit labels from
        # the JSON files (host / role / replica), preserving the v1.2.0e.1
        # labeling scheme.
        refresh_interval: 15s
    metrics_path: /metrics
