# fish-harness v1.2.0e.1 Prometheus config (per D9 + F25 + F28).
#
# Why this exists (per plan §2 D):
#   - 8 scrape jobs: newvps ×4 + edge1/2/3 + prometheus self
#   - 3 alert rules: memory > 80% / queue > 100 / worker offline > 5min
#   - Tailscale bind (per F28): tag:admin / tag:monitor reach this file
#
# v1.2.0e.1 hotfix (per U5 verification 2026-09-09): scrape targets now use
# the REAL Tailscale tailnet suffix `tail1b9878.ts.net` instead of the custom
# (unregistered) `fish-harness.ts.net`. Tailscale MagicDNS only auto-resolves
# `*.<tailnet>.ts.net`; the custom suffix was never delegated via split DNS,
# so every wrapper DNS lookup failed with NXDOMAIN. Long-term fix (v1.2.0f+)
# is to configure split DNS in the Tailscale admin to delegate
# `fish-harness.ts.net → 100.100.100.100`. For now, use the auto suffix.
#
# Deploy: `docker compose -f deploy/monitoring/docker-compose.yml up -d`
# Self-test: `curl http://newvps.tail1b9878.ts.net:9090/metrics`

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: fish-harness
    cycle: v1.2.0e.1

# ── Alert rules (3 per D9) ─────────────────────────────────────────────────
rule_files:
  - alerts.yml

# ── Scrape configs (7 hosts per F25) ──────────────────────────────────────
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          host: prometheus

  # newvps = fish-harness orchestrator (per U5 verification 2026-09-09:
  # scrape via CONTAINER IP on the shared `deploy_harness_net` bridge,
  # not via Tailscale IP. docker-proxy on lo refuses container→tun traffic
  # due to the kernel's local-table route `100.99.5.90 dev lo`. Bridge
  # gateway 172.25.0.1 routes through docker-proxy cleanly. IPs below
  # match the wrapper container IPs assigned by docker on deploy_harness_net;
  # if compose restarts renumber the bridge, run `docker inspect` to find
  # the new IPs and update this list, or convert to a service-discovery
  # config block (TODO: v1.2.0f+).
  - job_name: newvps-orch
    metrics_path: /metrics
    static_configs:
      - targets: ["172.25.0.6:4000"]
        labels:
          host: newvps
          role: orchestrator

  # 3 commander replicas on newvps
  - job_name: newvps-commander-1
    metrics_path: /metrics
    static_configs:
      - targets: ["172.25.0.5:4001"]
        labels:
          host: newvps
          role: commander
          replica: "1"

  - job_name: newvps-commander-2
    metrics_path: /metrics
    static_configs:
      - targets: ["172.25.0.9:4003"]
        labels:
          host: newvps
          role: commander
          replica: "2"

  # newvps-frontend has no /metrics endpoint (Next.js app) — this job
  # intentionally stays 'down' until a metrics exporter is added in v1.2.0f+.
  - job_name: newvps-frontend
    metrics_path: /metrics
    static_configs:
      - targets: ["172.25.0.7:4002"]
        labels:
          host: newvps
          role: frontend

  # 5 edge hosts — wrapper only (per F25)
  - job_name: edge1
    metrics_path: /metrics
    static_configs:
      - targets: ["edge1.tail1b9878.ts.net:4001"]
        labels:
          host: edge1
          role: wrapper

  - job_name: edge2
    metrics_path: /metrics
    static_configs:
      - targets: ["edge2.tail1b9878.ts.net:4001"]
        labels:
          host: edge2
          role: wrapper

  - job_name: edge3
    metrics_path: /metrics
    static_configs:
      - targets: ["edge3.tail1b9878.ts.net:4001"]
        labels:
          host: edge3
          role: wrapper
