# fish-harness v1.2.0d Prometheus config (per D9 + F25 + F28).
#
# Why this exists (per plan §2 D):
#   - 7 scrape jobs: newvps + 5 edge + macbook
#   - 3 alert rules: memory > 80% / queue > 100 / worker offline > 5min
#   - Tailscale bind (per F28): tag:admin / tag:monitor reach this file
#
# Deploy: `docker compose -f deploy/monitoring/prometheus.yml up -d`
# Self-test: `curl http://newvps:9090/metrics`

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: fish-harness
    cycle: v1.2.0d

# ── Alert rules (3 per D9) ─────────────────────────────────────────────────
rule_files:
  - alerts.yml

# ── Scrape configs (7 hosts per F25) ──────────────────────────────────────
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          host: prometheus

  # newvps = fish-harness orchestrator
  - job_name: newvps-orch
    metrics_path: /metrics
    static_configs:
      - targets: ["newvps.fish-harness.ts.net:4000"]
        labels:
          host: newvps
          role: orchestrator

  # 3 commander replicas on newvps
  - job_name: newvps-commander-1
    metrics_path: /metrics
    static_configs:
      - targets: ["newvps.fish-harness.ts.net:4001"]
        labels:
          host: newvps
          role: commander
          replica: "1"

  - job_name: newvps-commander-2
    metrics_path: /metrics
    static_configs:
      - targets: ["newvps.fish-harness.ts.net:4003"]
        labels:
          host: newvps
          role: commander
          replica: "2"

  - job_name: newvps-frontend
    metrics_path: /metrics
    static_configs:
      - targets: ["newvps.fish-harness.ts.net:4002"]
        labels:
          host: newvps
          role: frontend

  # 5 edge hosts — wrapper only (per F25)
  - job_name: edge1
    metrics_path: /metrics
    static_configs:
      - targets: ["edge1.fish-harness.ts.net:4001"]
        labels:
          host: edge1
          role: wrapper

  - job_name: edge2
    metrics_path: /metrics
    static_configs:
      - targets: ["edge2.fish-harness.ts.net:4001"]
        labels:
          host: edge2
          role: wrapper

  - job_name: edge3
    metrics_path: /metrics
    static_configs:
      - targets: ["edge3.fish-harness.ts.net:4001"]
        labels:
          host: edge3
          role: wrapper
