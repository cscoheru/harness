# fish-harness v1.2.0d monitoring stack (per D9).
#
# Why this exists (per plan §2 D + §3 U5):
#   - Prometheus server scrapes 7 hosts (newvps + 3 edge + 3 wrappers)
#   - 3 alert rules per alerts.yml
#   - Tailscale bind (per F28): port 9090 only reachable via tailnet
#
# Deploy: `docker compose -f deploy/monitoring/docker-compose.yml up -d`
# Self-test: `curl http://newvps:9090/metrics`

services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: fish-harness-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      # v1.2.0f NEW (per F1 + L21): mount the file_sd_configs targets
      # directory. Each JSON file under targets/ declares one scrape job's
      # targets + labels. Prometheus watches this directory via the
      # file_sd_configs block in prometheus.yml. Add a new wrapper host
      # by dropping a new *.json file (e.g., edge4.json) + restart —
      # auto-discovered within 15s (refresh_interval in prometheus.yml).
      # Host-mounted (not named volume) so file changes from the deploy
      # repo are picked up on the next compose up without volume dance.
      - ./targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"  # Tailscale bind only (no public exposure)
    networks:
      # v1.2.0e.1 NEW per D3: prometheus joins the SHARED EXTERNAL network
      # deploy_harness_net so it can scrape wrapper containers running on
      # the same shared network (newvps + 5 edge hosts). Without this join,
      # prometheus sits on its own monitoring_net bridge and DNS-resolves
      # nothing — every scrape fails with "no such host".
      deploy_harness_net:
        aliases:
          - prometheus
    # v1.2.0e.1 hotfix (per U5 verification 2026-09-09): prometheus must
    # resolve *.fish-harness.ts.net to scrape edge hosts. Docker's embedded
    # DNS (127.0.0.11) doesn't forward to Tailscale MagicDNS, so explicitly
    # point at 100.100.100.100 (Tailscale MagicDNS) + 1.1.1.1/8.8.8.8 for
    # public DNS. Same pattern as 6host-compose.newvps.yml dns: block.
    dns:
      - 100.100.100.100
      - 1.1.1.1
      - 8.8.8.8
    mem_limit: 512m
    cpus: "0.5"
    stop_grace_period: 30s

networks:
  # v1.2.0e.1 NEW per D3: rename monitoring_net → deploy_harness_net and mark
  # `external: true` so it joins the SAME shared bridge as the wrapper
  # compose (deploy/6host-compose.newvps.yml). One network, two compose
  # stacks — that's the whole point. Prereq: `docker network create
  # --driver bridge deploy_harness_net` once on the host.
  deploy_harness_net:
    name: deploy_harness_net
    external: true

volumes:
  prometheus_data:
