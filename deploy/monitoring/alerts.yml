# fish-harness v1.2.0d Prometheus alert rules (per D9 + F25).
#
# 3 alerts:
#   1. fish-harness-high-memory    — memory_used_mb > 80% of mem_limit for 5m
#   2. fish-harness-queue-backlog  — queue_depth > 100 for 5m
#   3. fish-harness-worker-offline — worker_count == 0 for 5m
#
# Runbook escalation per runbook.md.

groups:
  - name: fish-harness
    interval: 30s
    rules:
      # ── Alert 1: High memory (per D9) ─────────────────────────────────
      - alert: fish-harness-high-memory
        expr: memory_used_mb > 800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "fish-harness wrapper {{ $labels.host }} memory > 800MB"
          description: "{{ $labels.host }} memory_used_mb = {{ $value }}MB (threshold 800MB). Likely OOM imminent."

      # ── Alert 2: Queue backlog (per D8 + D9) ──────────────────────────
      - alert: fish-harness-queue-backlog
        expr: queue_depth > 100
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "fish-harness queue > 100 for 5m on {{ $labels.host }}"
          description: "queue_depth = {{ $value }}. max_in_flight=50 saturated; SQLite overflow growing."

      # ── Alert 3: Worker offline (per D9) ──────────────────────────────
      - alert: fish-harness-worker-offline
        expr: worker_count == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "fish-harness worker_count = 0 on {{ $labels.host }}"
          description: "No workers registered for 5min. Check worker_pool heartbeat + Tailscale ACL."
