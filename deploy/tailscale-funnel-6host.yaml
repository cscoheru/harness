# deploy/tailscale-funnel-6host.yaml — fish-harness v1.2.0c (T-V1.2.0C-CROSSHOST-MACBOOK-PASS)
#
# 7 Funnel entries: expose HTTPS endpoints for newvps + 5 edge hosts + MacBook
# Each Funnel maps a MagicDNS name → local HTTP service
#
# v1.2.0c NEW (per D5 + F11 + F15):
#   - MagicDNS rename: old suffix `.tail.legacy.ts.net` → canonical `.fish-harness.ts.net`
#     (aligns with 6host_router.ts wrapper; see audit-scope §3.8)
#   - Add MacBook entry (kjonemacbook.fish-harness.ts.net → 127.0.0.1:4001)
#
# Funnel enables HTTPS without certificates (Tailscale handles TLS)
# Auth: Tailscale identity (no Basic Auth; PRD-v1.1 §4.1)
#
# Setup on each host:
#   tailscale funnel 443
#   tailscale serve --yaml=tailscale-funnel-6host.yaml
#   tailscale funnel status
#
# Teardown:
#   tailscale funnel reset
#
# 7 host Funnel entries:
#   newvps.fish-harness.ts.net      → 127.0.0.1:4000  (orchestrator)
#   edge1.fish-harness.ts.net       → 127.0.0.1:4001  (east-1)
#   edge2.fish-harness.ts.net       → 127.0.0.1:4001  (west-1)
#   edge3.fish-harness.ts.net       → 127.0.0.1:4001  (asia-1)
#   edge4.fish-harness.ts.net       → 127.0.0.1:4001  (eu-1)
#   edge5.fish-harness.ts.net       → 127.0.0.1:4001  (sa-1)
#   kjonemacbook.fish-harness.ts.net → 127.0.0.1:4001  (local-mac, v1.2.0c NEW)
#
# 7 Funnel HTTPS URLs (MagicDNS -> local port):
#   https://newvps.fish-harness.ts.net/       -> newvps orchestrator :4000
#   https://edge1.fish-harness.ts.net/        -> edge1 wrapper :4001
#   https://edge2.fish-harness.ts.net/        -> edge2 wrapper :4001
#   https://edge3.fish-harness.ts.net/        -> edge3 wrapper :4001
#   https://edge4.fish-harness.ts.net/        -> edge4 wrapper :4001
#   https://edge5.fish-harness.ts.net/        -> edge5 wrapper :4001
#   https://kjonemacbook.fish-harness.ts.net/ -> macbook wrapper :4001 (v1.2.0c NEW)
#
# References:
#   - PRD-v1.1 §4.1: Tailscale-only
#   - PRD-v1.1 §3.1: MacBook 主力 worker (working hours)
#   - codex-audit-scope §3.8: MagicDNS naming裂痕修复
#   - codex-audit-scope §4.5: MagicDNS (no pinned IP)
#   - codex-audit-scope §4.13: MacBook worker 接入守门
# Co-Authored-By: Claude Code <noreply@anthropic.com>

https: true

routes:
  # ── newvps main node (orchestrator port 4000) ───────────────────────────────
  # Wrapper orchestrator: routes to harness kernel + coordinates workers
  newvps.fish-harness.ts.net:
    to: http://127.0.0.1:4000

  # ── edge1 east-1 (wrapper port 4001) ───────────────────────────────────────
  # HTTP reverse proxy: routes to newvps kernel via MagicDNS
  edge1.fish-harness.ts.net:
    to: http://127.0.0.1:4001

  # ── edge2 west-1 (wrapper port 4001) ───────────────────────────────────────
  edge2.fish-harness.ts.net:
    to: http://127.0.0.1:4001

  # ── edge3 asia-1 (wrapper port 4001) ────────────────────────────────────────
  edge3.fish-harness.ts.net:
    to: http://127.0.0.1:4001

  # ── edge4 eu-1 (wrapper port 4001) ─────────────────────────────────────────
  edge4.fish-harness.ts.net:
    to: http://127.0.0.1:4001

  # ── edge5 sa-1 (wrapper port 4001) ─────────────────────────────────────────
  edge5.fish-harness.ts.net:
    to: http://127.0.0.1:4001

  # ── macbook (v1.2.0c NEW per F15) ───────────────────────────────────────────
  # MacBook Pro M1 owner device acting as primary worker during working hours
  # (Mon-Fri 09:00-22:00 local time, per D6). Funnel entry exposes MacBook
  # wrapper port 4001 for cross-host dispatch from newvps + edge hosts.
  # ACL tag:macbook (declared in tailscale-acl-6host.yaml tagOwners).
  kjonemacbook.fish-harness.ts.net:
    to: http://127.0.0.1:4001

# Auth: handled by Tailscale identity (who you are in the tailnet).
# ACL in tailscale-acl-6host.yaml restricts which identities can reach each route.