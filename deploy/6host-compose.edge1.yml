# deploy/6host-compose.edge1.yml — fish-harness v1.1 M2 (T-M2-DO-1)
#
# Topology: east-1 edge host — wrapper orchestrator HTTP reverse proxy only
# Security:  Tailscale Funnel HTTPS (443) → wrapper:4001
# Role:      M2 边缘 host (east-1 region)
#
# M2 edge hosts (铁律):
#   - No STT worker (whisper.cpp 仅在 newvps; 避免 5×150MB 模型重复下载)
#   - No Web Push gateway (VAPID 私钥仅在 newvps 集中管理)
#   - Container inter-connect: use container_name (no pinned IP)
#   - Cross-host routing: Tailscale MagicDNS (newvps.fish-harness.ts.net)
#   - Port 4001 exposed via Tailscale Funnel (edge1.fish-harness.ts.net)
#
# References:
#   - PRD-v1.1 §3 M2: 6 host distributed
#   - codex-audit-scope §4.5: container IP 不锁; MagicDNS 跨 host
# Co-Authored-By: Claude Code <noreply@anthropic.com>

services:
  # ── edge wrapper orchestrator (east-1) ─────────────────────────────────────
  # Acts as HTTP reverse proxy: routes requests to newvps kernel via MagicDNS
  # class: orchestrator (not a specific SKU)
  edge-wrapper:
    container_name: harness-edge1-wrapper
    image: node:24-slim
    restart: unless-stopped
    working_dir: /app/wrapper
    volumes:
      - ..:/app:ro
    env_file:
      - env/edge-host.env.example
    environment:
      # Cross-host routing: MagicDNS name (no pinned IP; hygiene §4.5)
      HARNESS_API_URL: "http://newvps.fish-harness.ts.net:4000"
      WRAPPER_PORT: "4001"
      WORKER_ID: "${WORKER_ID:-edge1-wrapper}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      ORCHESTRATOR_CLASS: "orchestrator"
      DSH_PROFILE: "headless"
      EDGE_REGION: "east-1"
    networks:
      - harness_net
    ports:
      - "4001:4001"
    command: ["node", "build/server.js"]
    mem_limit: 512m
    memswap_limit: 512m

networks:
  harness_net:
    driver: bridge
