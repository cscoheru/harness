# deploy/6host-compose.edge2.yml — fish-harness v1.1 M2 (T-M2-DO-1)
#
# Topology: west-1 edge host — wrapper orchestrator HTTP reverse proxy only
# Security:  Tailscale Funnel HTTPS (443) → wrapper:4001
# Role:      M2 边缘 host (west-1 region)
#
# M2 edge hosts (铁律):
#   - No STT worker (whisper.cpp 仅在 newvps)
#   - No Web Push gateway (VAPID 私钥仅在 newvps 集中管理)
#   - Container inter-connect: use container_name (no pinned IP)
#   - Cross-host routing: Tailscale MagicDNS (newvps.fish-harness.ts.net)
#   - Port 4001 exposed via Tailscale Funnel
#
# References:
#   - PRD-v1.1 §3 M2: 6 host distributed
#   - codex-audit-scope §4.5: container IP 不锁; MagicDNS 跨 host
# Co-Authored-By: Claude Code <noreply@anthropic.com>

services:
  # ── edge wrapper orchestrator (west-1) ─────────────────────────────────────
  edge-wrapper:
    container_name: harness-edge2-wrapper
    image: node:24-slim
    restart: unless-stopped
    working_dir: /app/wrapper
    volumes:
      - ..:/app:ro
    env_file:
      - env/edge-host.env.example
    environment:
      HARNESS_API_URL: "http://newvps.fish-harness.ts.net:4000"
      WRAPPER_PORT: "4001"
      WORKER_ID: "${WORKER_ID:-edge2-wrapper}"
      # v1.2.0e NEW: edge worker self-registers + heartbeat to newvps orchestrator
      # (worker_pool.ts heartbeat_sender loop). Without this, server.ts
      # startWorkerHeartbeatSender() is inert and workers table stays empty.
      WORKER_HEARTBEAT_URL: "http://newvps.fish-harness.ts.net:4000"
      WORKER_HOST: "edge2.fish-harness.ts.net"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      ORCHESTRATOR_CLASS: "orchestrator"
      DSH_PROFILE: "headless"
      EDGE_REGION: "west-1"
    networks:
      - harness_net
    ports:
      - "4001:4001"
    # v1.2.0e.1 NEW per D7: Tailscale MagicDNS + public DNS fallback (same as
    # newvps-compose.yml wrapper service). Without 1.1.1.1/8.8.8.8, containers
    # can resolve *.fish-harness.ts.net (100.100.100.100) but fail on public
    # domains like api.deepseek.com (D16 direct call).
    dns:
      - 100.100.100.100
      - 1.1.1.1
      - 8.8.8.8
    command: ["node", "build/server.js"]
    mem_limit: 1g
    memswap_limit: 1g
    # v1.2.0j+.8+ NEW per §6.a (P1 forward scope, deferred from v1.2.0j+.7+ closure):
    # Mirror 6host-compose.newvps.yml wrapper-orchestrator healthcheck pattern
    # (lines 193-198). Probe http://localhost:4001/health every 30s with 10s timeout.
    # 3 retries fail → unhealthy → `restart: unless-stopped` restart. start_period
    # 15s gives boot time before first probe. stop_grace_period 30s parallels
    # the existing F27 graceful drain — G8.1 SIGTERM handler (already present in
    # wrapper server.ts via v1.2.0i G8.1) gets time to drain in-flight requests.
    # Edge hosts need rebuild to pick up healthcheck (user OOB).
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    # v1.2.0d NEW per D7 + F27: edge wrapper 1G + 30s graceful drain

networks:
  harness_net:
    driver: bridge
